<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烛阴旧闻 v9</title><style>body{margin:0;background:#77706a;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#2b2724}.win{width:min(1180px,96vw);height:92vh;margin:4vh auto;background:#f7f2e8;display:flex;flex-direction:column;box-shadow:0 20px 70px #0008}.bar{background:#3a3430;color:#ddd;padding:10px 14px}.head{background:#2d2723;color:#f5eee4;padding:15px 20px;display:flex;align-items:center}.head h1{margin:0;letter-spacing:4px}.head small{color:#b9aea3}.acct{margin-left:auto;text-align:right}.nav{background:#50443a;padding:0 14px;display:flex}.nav button{background:none;border:0;color:#fff;padding:11px 13px;cursor:pointer}.search{padding:12px 18px;background:#ece5da;display:flex;gap:8px;border-bottom:1px solid #cfc5b8}.search input{flex:1;padding:10px;border:1px solid #b8ada0}.search button{padding:0 20px;background:#5b4c40;color:#fff;border:0}.grid{display:grid;grid-template-columns:1fr 280px;min-height:0;flex:1}.main{overflow:auto;padding:18px 20px}.side{overflow:auto;border-left:1px solid #cfc5b8;background:#efe8dc;padding:14px}.topic{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #d8cfc3;padding:13px 8px;cursor:pointer}.topic:hover{background:#eee6da}.topic b{display:block;font-size:15px}.topic p{margin:5px 0;color:#71685f;font-size:13px}.meta{color:#958a80;font-size:11px}.panel{border:1px solid #cfc5b8;background:#faf6ef;margin-bottom:12px}.panel h3{margin:0;padding:9px 10px;background:#ddd3c6;font-size:14px}.panel div{padding:10px;font-size:12px;color:#6e655c;line-height:1.6}.thread h2{margin-top:5px}.floor{display:grid;grid-template-columns:120px 1fr;border:1px solid #d0c5b7;border-bottom:0}.floor:last-child{border-bottom:1px solid #d0c5b7}.user{background:#eee5d8;padding:12px;text-align:center}.user button{border:0;background:none;color:#365f78;font-weight:bold;cursor:pointer}.body{background:#fffdf8;padding:14px;line-height:1.8}.body small{display:block;color:#978c82;border-bottom:1px dashed #ddd1c4;margin-bottom:8px}.back{border:0;background:none;color:#365f78;cursor:pointer;padding:0 0 10px}.userpage h2{border-bottom:2px solid #59493e;padding-bottom:10px}.row{border-bottom:1px solid #ddd2c5;padding:10px 0}.row button{border:0;background:none;color:#365f78;font-weight:bold;cursor:pointer}.quote{margin-top:6px;background:#eee7dc;border-left:3px solid #9b8876;padding:8px;font-size:13px}.pm{max-width:680px}.bubble{background:#e3ddd4;padding:10px 12px;margin:10px 0;border-radius:6px}.choice{display:flex;gap:8px}.choice button{flex:1;padding:10px;background:#fffaf3;border:1px solid #a99b8d;cursor:pointer}.badge{background:#a6443d;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px}.empty{text-align:center;color:#81776e;padding:50px}.hero{border-bottom:2px solid #59493e;padding-bottom:10px;margin-bottom:10px}.hero h2{margin:0 0 4px}.hero p{margin:0;color:#756b62;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.side{display:none}.win{height:96vh;margin:2vh auto}.floor{grid-template-columns:90px 1fr}}</style></head><body><div id="app"></div><script>
const posts=[
{id:'33897',title:'分享一组岚棉三厂旧址的窗户照片',author:'候鸟第七年',board:'旧闻考据',date:'10月13日',excerpt:'4栋右侧窗框的颜色很奇怪。',body:['上周去了趟岚州，拍了一组岚棉三厂旧家属区。大部分楼已经封了。','看到4栋的时候有一种很强的熟悉感，不像来过，更像知道拐进去以后楼梯在哪。'],replies:[['旧纸鸢','三厂资料可以去岚州市图地方文献室查。'],['折柳','熟悉感先记，不要立刻拿它证明什么。']]},
{id:'20847',title:'最近总梦见一间没住过的房子',author:'候鸟第七年',board:'梦与睡眠',date:'6月18日',excerpt:'红铁皮糖盒、褪色蓝窗帘、朝走廊开的厨房门。',body:['这件事从去年十一月开始，最近三个月频率突然变高。','梦里有人在厨房里叫我，以前只记得最后两个音像“楠楠”。我不确定是不是名字，也可能只是囡囡。'],replies:[['逆光风筝','“楠楠”也不一定是名字，先别补汉字。'],['折柳','先画结构，不要急着给梦里的人起名字。']]},
{id:'34021',title:'凌晨两点楼上每天拖椅子，录音却录不到',author:'卷毛',board:'闲聊灌水',date:'今天',excerpt:'物业最后查出来像是水箱增压泵。',body:['这周连续四天，凌晨两点零几分天花板都响。'],replies:[['修空调的老周','先查楼顶增压泵。']]},
{id:'33401',title:'找回来的猫突然不吃原来的粮，是不是吓到了',author:'橘猫法官',board:'生活求助',date:'10月10日',excerpt:'失踪三天后自己回家。',body:['猫跑出去三天自己回来了，性格也比以前黏人。'],replies:[['猫砂铲屎官','先体检。']]},
{id:'09114',hidden:1,title:'【旧报】岚棉三厂家属区九岁女童失踪，十三日后异地找回',author:'报刊索引',board:'旧闻考据',date:'2009-05-22',excerpt:'2004年岚州地方报纸摘录。',body:['2004-07-18，岚棉三厂家属区九岁女童林楠失踪。','2004-07-31，林楠在外市客运站附近被找到，对失踪期间经历无法完整说明。'],replies:[['折柳','如果要做横向比较，先把原报日期、年龄、失踪时长记清楚。']]},
{id:'09831',hidden:1,title:'【旧报】九岁女童失踪十三天后在河临南站附近被找回',author:'报刊索引',board:'旧闻考据',date:'2009-05-18',excerpt:'2004年河临地方报纸索引。',body:['2004-07-17，九岁沈妍在河临市青梧区少年宫外失踪。','2004-07-30，沈妍在河临南站附近被找到，失踪共十三天。'],replies:[['折柳','两个地方的旧报不要只凭“十三天”就硬连。']]},
{id:'14692',hidden:1,title:'有没有人记得“被找回来”之前的家',author:'反方向的钟',board:'生活求助',date:'2019-04-07',excerpt:'小时候走失后，一直觉得父母把自己的名字叫错了。',body:['我六岁时走失过几天，被送回来后有很长一段时间觉得他们叫我的名字不对。','成年后查到当年的寻人启事，失踪和找回时间都能对上。'],replies:[['折柳','能核实旧报的话，把原始信息和成年后的解释分开写。'],['照骨','回来以后有没有突然怕以前不怕的气味？']]},
{id:'15103',hidden:1,title:'我表哥小时候被换过魂，回来后彻底变了一个人',author:'孤坟蹦迪王',board:'灵异杂谈',date:'2019-09-11',excerpt:'楼主称表哥走失七天后性格大变。',body:['我表哥小时候失踪七天，回来以后连狗都不认识。'],replies:[['折柳','你去年帖子里说自己父母都是独生子女，哪来的表哥？'],['孤坟蹦迪王','网络称呼而已，别抬杠。']]},
{id:'17119',hidden:1,title:'七岁走失后总觉得自己应该叫另一个名字',author:'迟迟',board:'生活求助',date:'2021-11-03',excerpt:'旧报可以核验；用户不愿公开真实姓名。',body:['七岁时走失过一周，回来后有很长时间觉得家里人叫错了名字。','后来找到旧报，时间能对上。回来后还不会骑原来会骑的自行车。'],replies:[['候鸟第七年','我小时候也失踪过。方便私信吗？'],['迟迟','可以，但别在公开区写真名。'],['折柳','先留好原始旧报。'],['照骨','你被找到当天，有没有人叫过你一个完全陌生的名字？']]},
{id:'15571',hidden:1,title:'小时候失踪后突然改用左手，有类似的吗',author:'夏夜停电',board:'生活求助',date:'2020-02-14',excerpt:'自称八岁时失踪五天。',body:['家里一直说我八岁走丢五天，但父母说不清具体日期，也找不到报警记录。'],replies:[['折柳','没有核验记录，就先别把成年习惯变化反推成失踪证据。'],['照骨','有没有反复梦见固定的室内？']]}
];
let st={view:'home',cur:null,q:'',searches:[],pm:0,seenFold:false,pmDone:false};
const n=s=>String(s||'').toLowerCase().replace(/[“”‘’#，。！？、\s]/g,'');
const text=p=>[p.title,p.author,p.board,p.excerpt,...p.body,...p.replies.flat()].join(' ');
function go(v,c=null){st.view=v;st.cur=c;if(v==='user'&&c==='折柳')st.seenFold=true;render();trigger()}
function search(q){q=q.trim();if(!q)return;st.q=q;st.searches.unshift(q);go('search',q)}
function trigger(){if(st.seenFold&&st.searches.some(x=>n(x).includes('失踪')||n(x).includes('林楠'))&&!st.pm){st.pm=1;render()}}
function topic(p){return `<button class=topic onclick="go('post','${p.id}')"><b>${p.title}</b><p>${p.excerpt}</p><span class=meta>${p.author} · ${p.board} · ${p.date}</span></button>`}
function home(){return `<div class=hero><h2>论坛首页</h2><p>这里只显示最近与热门内容。更早的内容需要自己搜索。</p></div>${posts.filter(p=>!p.hidden).map(topic).join('')}`}
function post(){let p=posts.find(x=>x.id===st.cur);let f=`<div class=floor><div class=user><button onclick="go('user','${p.author}')">${p.author}</button></div><div class=body><small>${p.date} · 楼主</small>${p.body.map(x=>`<p>${x}</p>`).join('')}</div></div>`;p.replies.forEach((r,i)=>f+=`<div class=floor><div class=user><button onclick="go('user','${r[0]}')">${r[0]}</button></div><div class=body><small>${i+2}楼</small><p>${r[1]}</p></div></div>`);return `<button class=back onclick="go('home')">← 返回论坛</button><div class=thread><h2>${p.title}</h2><div class=meta>${p.board} · #${p.id}</div>${f}</div>`}
function results(){let q=st.cur,ts=q.split(/\s+/).map(n).filter(Boolean),rs=posts.filter(p=>ts.every(t=>n(text(p)).includes(t)));return `<div class=hero><h2>搜索「${q}」</h2><p>${rs.length} 条公开索引</p></div>${rs.length?rs.map(topic).join(''):`<div class=empty>没有找到完全匹配的公开内容。试试更短的人名、地点、年份或账号。</div>`}`}
function user(){let name=st.cur,rows=[];posts.forEach(p=>{if(p.author===name)rows.push(['主题',p,p.title]);p.replies.forEach(r=>{if(r[0]===name)rows.push(['回复',p,r[1]])})});return `<button class=back onclick="go('home')">← 返回论坛</button><div class=userpage><h2>${name}</h2><div class=meta>公开发言记录 ${rows.length} 条</div>${rows.map(r=>`<div class=row><span class=meta>${r[0]}</span> <button onclick="go('post','${r[1].id}')">${r[1].title}</button><div class=quote>${r[2]}</div></div>`).join('')||'<div class=empty>没有公开记录</div>'}</div>`}
function pm(){st.pm=0;return `<div class=hero><h2>私信</h2><p>当前登录：候鸟第七年</p></div><div class=pm><div class=bubble><b>迟迟</b><br>你是不是在翻候鸟以前那些帖子？</div><div class=bubble><b>迟迟</b><br>如果是她本人，让她别在公开区写真名。</div>${st.pmDone?'<div class=bubble><b>你</b><br>我只是帮她找一些旧资料。</div><div class=bubble><b>迟迟</b><br>那你先别联系帖子里那些主动问地址的人。尤其是总问“被找到当天发生了什么”的。</div>':`<div class=choice><button onclick="st.pmDone=true;render()">我只是帮她找一些旧资料。</button><button onclick="alert('这一版先不开放高风险追问；后续会保留两选一，但不会一次选错就坏结局。')">沈妍失踪了，你知道什么？</button></div>`}</div>`}
function main(){return st.view==='home'?home():st.view==='post'?post():st.view==='search'?results():st.view==='user'?user():st.view==='pm'?pm():home()}
function render(){document.getElementById('app').innerHTML=`<div class=win><div class=bar>🔒 www.zhuyinwen.cn</div><div class=head><div><h1>烛阴旧闻</h1><small>民俗 · 旧闻 · 城市记忆</small></div><div class=acct><b>候鸟第七年</b><br><small>当前登录账号</small></div></div><div class=nav><button onclick="go('home')">论坛首页</button><button onclick="go('user','候鸟第七年')">我的主页</button><button onclick="go('pm')">私信 ${st.pm?'<span class=badge>1</span>':''}</button></div><form class=search onsubmit="event.preventDefault();search(document.getElementById('q').value)"><input id=q value="${st.q}" placeholder="搜索用户名 / 地点 / 年份 / 原句"><button>全站搜索</button></form><div class=grid><main class=main>${main()}</main><aside class=side><div class=panel><h3>账号</h3><div>候鸟第七年<br>注册于 2017-07-12<br><br>点击帖子里的用户名，可以查看其公开发言记录。</div></div><div class=panel><h3>最近搜索</h3><div>${st.searches.slice(0,6).map(x=>`<div><a href=# onclick="search('${x}')">${x}</a></div>`).join('')||'暂无'}</div></div></aside></div></div>`}
window.go=go;window.search=search;window.st=st;render();
</script></body></html>
