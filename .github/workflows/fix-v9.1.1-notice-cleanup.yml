name: Fix v9.1.1 Notice Cleanup

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/workflows/fix-v9.1.1-notice-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/fix_v911_notice_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix WeChat notice cleanup type"
          git push origin HEAD:agent/v8-forum-gameplay-rework
