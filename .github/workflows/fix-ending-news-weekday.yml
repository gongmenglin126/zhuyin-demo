name: Fix Ending News Weekday

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/fix-ending-news-weekday.py
      - .github/workflows/fix-ending-news-weekday.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-ending-news-weekday.py
      - run: npm run build:single
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/GameEnding.tsx content/endingDialogues.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix ending news weekdays"
          git push origin HEAD:agent/v8-forum-gameplay-rework
