name: Apply v9.1.1 Persistence

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/workflows/apply-v9.1.1-persistence.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply patch
        run: python .github/scripts/apply_v911_persistence_materials_notifications.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Persist app state and add admin material and WeChat notification flow"
          git push origin HEAD:agent/v8-forum-gameplay-rework
