name: Apply Forum Flow Source

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - content/gameDataFlow.ts
      - scripts/apply-flow-source.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply flow layer to v8 page
        run: node scripts/apply-flow-source.mjs
      - name: Apply v9.2 admin storyflow
        run: python .github/scripts/apply_v920_admin_storyflow.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- app/page.tsx app/AdminPortalOccult.tsx app/InteractiveWechat.tsx; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/AdminPortalOccult.tsx app/InteractiveWechat.tsx
          git commit -m "Apply v9.2 admin investigation flow"
          git push origin HEAD:agent/v8-forum-gameplay-rework
