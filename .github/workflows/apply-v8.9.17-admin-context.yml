name: Apply v8.9.17 Admin Context

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v8917_admin_context.py'
      - '.github/workflows/apply-v8.9.17-admin-context.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v8917_admin_context.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make admin suspicion reply state-aware"
          git push origin HEAD:agent/v8-forum-gameplay-rework
