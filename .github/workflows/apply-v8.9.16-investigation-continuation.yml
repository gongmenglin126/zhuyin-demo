name: Apply v8.9.16 Investigation Continuation

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/workflows/apply-v8.9.16-investigation-continuation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply v8.9.16 source patch
        run: python .github/scripts/apply_v8916.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveWechat.tsx content/gameDataFlowV2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add follow-up chats and legacy admin route"
          git push