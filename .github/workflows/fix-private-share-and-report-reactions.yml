name: Fix private share and report reactions

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/fix-private-share-and-report-reactions.py
      - .github/workflows/fix-private-share-and-report-reactions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-private-share-and-report-reactions.py
      - run: npm run build:single
      - name: Verify behavior text in build
        run: |
          grep -F "……你为什么在找这个？" single-dist/index.html
          grep -F "这条也是九岁？" single-dist/index.html
          grep -F "这篇突然清楚了很多。" single-dist/index.html
          test -f public/assets/occult/factory-faceless-idol.jpg
          test ! -f public/assets/occult/factory-faceless-idol.svg
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx content/wechatLiveDialogues.ts
          git commit -m "Fix private material sharing and old-report reactions"
          git push origin HEAD:agent/v8-forum-gameplay-rework
      - name: Publish updated playtest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./single-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
      - name: Clean temporary fix files
        run: |
          git rm -f scripts/fix-private-share-and-report-reactions.py .github/workflows/fix-private-share-and-report-reactions.yml
          if [ -f scripts/fix-idol-and-photo-hint.py ]; then git rm -f scripts/fix-idol-and-photo-hint.py; fi
          if [ -f .github/workflows/fix-idol-and-photo-hint.yml ]; then git rm -f .github/workflows/fix-idol-and-photo-hint.yml; fi
          git commit -m "Remove temporary fix workflows"
          git push origin HEAD:agent/v8-forum-gameplay-rework
