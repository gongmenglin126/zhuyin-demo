name: Apply V3 Organization Evolution

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/workflows/apply-v3-org-evolution.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework

      - name: Expand organization evolution in admin and canon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Player-visible admin history: explain the change from abducted children
          # to adult voluntary candidates, while keeping forced recovery of old samples separate.
          p = Path('app/AdminPortalOccult.tsx')
          s = p.read_text()
          pattern = re.compile(
              r'<section style=\{s\.adminPanel\}><h4>筛选规范沿革</h4>.*?</section>\n <section style=\{s\.adminPanel\}><h4>归真序列 · 阶段 II</h4>',
              re.S,
          )
          replacement = '''<section style={s.adminPanel}><h4>候舍制度沿革</h4>
 <Record date="2004版" title="低龄强制样本优先" meta="适用：7—11岁" text="早期判断：身份与社会关系尚未完全固化的对象更容易适应易舍；返家后的记忆、性格异常也更容易被解释为失踪创伤。沈妍、林楠属于这一阶段。"/>
 <Record date="长期复核" title="年龄并非稳定性的必要条件" meta="2004—2011 长期样本" text="持续观察显示，长期稳定更接近对契匹配、生理适配与易舍后的身份重建能力，低龄本身并不带来决定性优势。强制取得低龄样本的暴露风险反而持续升高。"/>
 <Record date="2012修订" title="停止低龄优先，成年自愿候舍纳入正式序列" meta="制度转向" text="组织将筛选重点改为对契匹配、去名训练和成年自愿对象。教内把奉舍解释为舍弃旧身、为客让门；稳定信徒开始主动递交候舍申请。"/>
 <Record date="现行" title="候舍来源充足，无需强制补充普通身体" meta="成年候舍已规模化" text="常规易舍优先从奉舍申请中匹配。强制控制仅用于旧契样本、返契异常与其他不可替代的长期观察对象。"/>
 </section>
 <section style={s.adminPanel}><h4>现行对象分流</h4>
 <Record date="普通候舍" title="成年自愿申请" meta="候舍库 / 去名训练" text="提供常规易舍所需身体来源。数量充足，不需要从论坛随机抓人补库。"/>
 <Record date="旧契样本" title="历史成功易舍的长期对象" meta="不可替代" text="价值在多年连续观察与旧对契数据，不等同于普通候舍。出现同步、返契异常时可被强制回收控制；0712-4471 属于此类。"/>
 <Record date="论坛命中" title="先观察、核验、线下接触" meta="不是候舍招募名单" text="论坛用于筛查历史异常和身份错位经历。命中对象通常进入观察或接触流程，并不会因为发过异常经历就自动被抓去易舍。"/>
 </section>
 <section style={s.adminPanel}><h4>归真序列 · 阶段 II</h4>'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'admin evolution section patch failed: {n}')
          p.write_text(s2)

          # Canon: make the same distinction explicit so future development cannot drift.
          p = Path('docs/CANON_v3.0_世界观与游戏设定唯一权威集.md')
          s = p.read_text()
          pattern = re.compile(r'### 14\.2 2012 前后改为成年候舍.*?(?=\n## 15\. 候舍库)', re.S)
          replacement = '''### 14.2 2012 前后为什么停止低龄优先

长期观察逐渐推翻了早期假设：**年龄不是易舍长期稳定的决定性条件。**

真正与稳定更相关的是：

- 对契匹配；
- 生理适配；
- 客的长期稳定性；
- 易舍后的身份重建能力；
- 对新社会身份的适应与控制。

与此同时，强制取得儿童样本存在明显缺陷：

- 失踪会迅速引发家庭、警方与媒体关注；
- 儿童无法长期稳定配合复杂准备与观察；
- 强制样本难以规模化；
- 即使年龄低，也不能消除记忆回流、身份错位和旧契异常。

因此 2012 前后组织停止“低龄优先”，并不是出于道德转变，而是因为这条路线被证明**风险高、收益低、不可规模化**。

### 14.3 为什么后来会有大量成年志愿候舍

组织教义与技术同步成熟后，“候舍”从实验对象变成了一套正式的教内制度。

教内将身体解释为暂住之“舍”，把主动放弃当前身体包装成奉献行为。对核心信徒而言：

- 被选中不是受害，而是“奉舍”；
- 进入普通客序列已经是功德；
- 若能进入真君序列则被视为更高等级的奉献；
- 原姓名、照片、家庭关系被视为妨碍舍身的旧身份残留。

因此组织不再需要随机绑架普通成年人来补充身体，而是从已经接受教义的核心信徒中形成稳定候舍池。

**去名训练**承担了过去组织误以为“儿童身份未固化”才能提供的功能：它不是魔法，而是人为削弱候舍者对原姓名、身体和社会关系的依附，提高易舍后的配合度与可控性。

所以现代候舍者的核心特征是：

> **主动、成年、受训、狂热，而且数量充足。**

### 14.4 那为什么现代组织仍会强制抓成年人

必须区分三类对象：

1. **普通候舍**：成年自愿信徒，为常规易舍提供身体；通常不需要强制取得；
2. **旧契样本 / 长期样本**：历史上已经完成易舍并稳定生活多年的对象，其多年数据无法重新制造；出现异常时会被强制回收；
3. **论坛筛查对象**：疑似历史异常、身份错位或旧案幸存者，通常先观察、核验、接触，不等于自动进入候舍库。

因此“现代还抓成年人”不能理解为“组织现在改抓大人来补身体”。

**沈妍被抓，是第二类。**

她的身体并不稀缺；稀缺的是：

- 2004 成功易舍；
- 与另一端形成并维持约 22 年的旧对契；
- 客 α 再舍后，她这一端出现罕见同步异常；
- 这条异常直接关系到“长期客能否连续再舍”的验证。

因此她是**不可替代的历史实验样本**。候舍库里哪怕再多一千名志愿者，也替代不了她已经积累的二十多年时间数据。

'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'canon evolution section patch failed: {n}')
          p.write_text(s2)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx docs/CANON_v3.0_世界观与游戏设定唯一权威集.md
          git diff --cached --quiet || git commit -m "Explain organization shift from child samples to adult candidates"
          git push
