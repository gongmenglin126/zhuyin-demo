name: Apply v9.0.5 Flow and Verse Fix

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/workflows/apply-v9.0.5-flow-and-verse.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply v9.0.5 patch
        run: python .github/scripts/apply_v905_flow_and_verse_fix.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/AdminPortalOccult.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix legacy verification flow and cached scripture scrolling"
          git push origin HEAD:agent/v8-forum-gameplay-rework
