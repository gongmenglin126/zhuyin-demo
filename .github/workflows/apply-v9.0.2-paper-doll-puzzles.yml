name: Apply v9.0.2 Paper Doll Puzzles

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v902_paper_doll_puzzles.py'
      - '.github/workflows/apply-v9.0.2-paper-doll-puzzles.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v902_paper_doll_puzzles.py
      - name: Commit source and canon changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app content docs
          git diff --cached --quiet && exit 0
          git commit -m "Replace admin quiz with paper doll puzzles"
          git push origin HEAD:agent/v8-forum-gameplay-rework

# trigger: v9.0.2
