name: Polish Liang Return To Nest

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/polish-liang-return-to-nest.py
      - .github/workflows/polish-liang-return-to-nest.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/polish-liang-return-to-nest.py
      - run: npm run build:single
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/InteractiveWechat.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Give Liang an emotional return-to-nest reaction"
          git push origin HEAD:agent/v8-forum-gameplay-rework
