name: Apply WeChat Dialogue Extract

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-wechat-dialogue-extract.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply dialogue extraction
        run: python scripts/apply-wechat-dialogue-extract.py
      - name: Verify single-file build
        run: npm run build:single
      - name: Commit verified source change
        run: |
          if git diff --quiet -- app/InteractiveWechat.tsx; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx
          git commit -m "Use centralized WeChat dialogue copy"
          git push origin HEAD:agent/v8-forum-gameplay-rework
