name: Fix idol image and photo hint

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/fix-idol-and-photo-hint.py
      - .github/workflows/fix-idol-and-photo-hint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-idol-and-photo-hint.py
      - run: npm run build:single
      - name: Verify built output
        run: |
          grep -F "我帖子里有一组旧家属区的照片" single-dist/index.html
          grep -F "factory-faceless-idol.jpg" content/gameDataFlowV2.ts
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/gameDataFlowV2.ts public/assets/occult/factory-faceless-idol.jpg public/assets/occult/factory-faceless-idol.svg
          git commit -m "Fix faceless idol image and photo clue"
          git push origin HEAD:agent/v8-forum-gameplay-rework
      - name: Publish updated playtest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./single-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
