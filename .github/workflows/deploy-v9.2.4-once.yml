name: Deploy v9.2.4 staged reasoning once

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - .github/workflows/deploy-v9.2.4-once.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - name: Verify staged reasoning and assets
        shell: bash
        run: |
          grep -F 'const LY_ADMIN_FLOW=' app/InteractiveWechat.tsx
          grep -F '然后他们把这件事叫‘归巢’。' app/InteractiveWechat.tsx
          grep -F '她真的在‘沈妍’和‘林楠’两个名字之间来回说？' app/InteractiveWechat.tsx
          grep -F '该称谓不进入姓名索引' app/game-fixes.css
          ! grep -F 'ly-admin-2021-direct' app/InteractiveWechat.tsx
          test -f single-dist/index.html
          test -f single-dist/assets/occult/factory-faceless-idol.jpg
      - name: Publish updated playtest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./single-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
      - name: Remove one-time deployment workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/deploy-v9.2.4-once.yml
          git commit -m "Remove one-time v9.2.4 deploy workflow"
          git push origin HEAD:agent/v8-forum-gameplay-rework
