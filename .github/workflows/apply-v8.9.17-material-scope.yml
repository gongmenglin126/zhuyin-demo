name: Apply v8.9.17 Material Scope

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v8917_material_scope.py'
      - '.github/workflows/apply-v8.9.17-material-scope.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply material scope patch
        run: python .github/scripts/apply_v8917_material_scope.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveWechat.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Scope forum materials and fix added state"
          git push origin HEAD:agent/v8-forum-gameplay-rework
