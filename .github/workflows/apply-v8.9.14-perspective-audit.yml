name: Apply v8.9.14 Perspective Audit

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/workflows/apply-v8.9.14-perspective-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply audit patch
        run: python .github/scripts/apply_v8914.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/PrivateArea.tsx app/LocalVault.tsx app/DeepArchiveGate.tsx app/InteractiveWechat.tsx content/gameDataFlow.ts content/gameDataFlowV2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Remove author voice and naturalize WeChat history"
          git push
