name: Apply v9 Gate Persistence

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v900_gate_persist.py'
      - '.github/workflows/apply-v9-gate-persist.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v900_gate_persist.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx content/gameDataFlowV2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Persist admin investigation prerequisites"
          git push origin HEAD:agent/v8-forum-gameplay-rework
