name: Fix WeChat Preview

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/fix-wechat-preview.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply preview fix
        run: python scripts/fix-wechat-preview.py
      - name: Verify build
        run: npm run build:single
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx
          git commit -m "Derive WeChat preview from latest message"
          git push origin HEAD:agent/v8-forum-gameplay-rework
