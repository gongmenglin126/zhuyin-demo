name: Apply Candidate Madness Copy

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-candidate-madness.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply candidate copy
        run: python scripts/apply-candidate-madness.py
      - name: Verify build
        run: npm run build:single
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/adminDialogues.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Intensify candidate offering applications"
          git push origin HEAD:agent/v8-forum-gameplay-rework
