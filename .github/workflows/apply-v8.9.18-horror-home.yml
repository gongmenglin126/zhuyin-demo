name: Apply v8.9.18 Horror Home

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v8918_horror_home.py'
      - '.github/workflows/apply-v8.9.18-horror-home.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply horror and homepage patch
        run: python .github/scripts/apply_v8918_horror_home.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/AdminPortal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Curate forum home and darken ritual path"
          git push origin HEAD:agent/v8-forum-gameplay-rework
