name: Apply v9.0.2 Reach Persistence

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v902_reach_persist.py'
      - '.github/workflows/apply-v9.0.2-reach-persist.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v902_reach_persist.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep both paper dolls reaching for shared object"
          git push origin HEAD:agent/v8-forum-gameplay-rework
