name: Apply v8.9.17 Admin Dialogue

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v8917_admin_dialogue.py'
      - '.github/workflows/apply-v8.9.17-admin-dialogue.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply admin dialogue patch
        run: python .github/scripts/apply_v8917_admin_dialogue.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Naturalize admin suspicion dialogue"
          git push origin HEAD:agent/v8-forum-gameplay-rework
