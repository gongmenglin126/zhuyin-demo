name: Apply v9.0.2 Residual Cleanup

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v902_residual_cleanup.py'
      - '.github/workflows/apply-v9.0.2-residual-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v902_residual_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app content
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete name-mechanic wording"
          git push origin HEAD:agent/v8-forum-gameplay-rework
