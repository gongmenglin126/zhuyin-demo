name: Add Missing Scripture Forum Post

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths: ['.github/workflows/apply-v8.9.13b-scripture-post.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Add linked forum post
        shell: bash
        run: |
          echo '' | xxd -r -p | gunzip > /tmp/add_post.py
          python /tmp/add_post.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gameDataFlowV2.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add linked scripture comparison post"
          git push
