name: Apply v9.1.2 Liang Dialogue

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/scripts/apply_v912_liang_dialogue.py'
      - '.github/workflows/apply-v9.1.2-liang-dialogue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_v912_liang_dialogue.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/InteractiveWechat.tsx
          git diff --cached --quiet || git commit -m 'Continue Liang admin dialogue'
          git push origin HEAD:agent/v8-forum-gameplay-rework
