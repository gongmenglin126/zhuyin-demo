name: Apply v9.1.0 Admin NPCs Final

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/workflows/apply-v9.1.0-admin-npcs-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply source patch
        run: python .github/scripts/apply_v910_admin_npcs.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Rework admin database and activate core NPCs"
          git push origin HEAD:agent/v8-forum-gameplay-rework
