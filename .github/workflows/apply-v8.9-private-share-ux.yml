name: Repair Private Share Source

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/workflows/apply-v8.9-private-share-ux.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair duplicated private share edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/PrivateArea.tsx')
          s=p.read_text()
          duplicate=' const [shared,setShared]=useState(false);\n const [shared,setShared]=useState(false);'
          while duplicate in s:
              s=s.replace(duplicate,' const [shared,setShared]=useState(false);')
          import re
          s=re.sub(r' \}\);setShared\(true\)\};(?:setShared\(true\)\};)*\};', ' });setShared(true)};', s)
          hint='{shared&&<p style={s.sharedHint}>已加入材料列表。打开微信后，在周川或梁茵聊天底部点“选择材料”即可发送。</p>}'
          while hint+hint in s:
              s=s.replace(hint+hint,hint)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build repaired source
        run: npm run build:single
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/PrivateArea.tsx
          git diff --cached --quiet || git commit -m "Repair private material sharing state"
          git push
