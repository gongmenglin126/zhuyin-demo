name: Apply Editable Copy Extraction

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-editable-copy-extraction.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract editable copy
        run: python scripts/apply-editable-copy-extraction.py
      - name: Verify single-file build
        run: npm run build:single
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx app/page.tsx app/AdminPortalOccult.tsx app/GameEnding.tsx content/wechatLiveDialogues.ts content/forumDialogues.ts content/adminDialogues.ts content/endingDialogues.ts content/README_EDIT_TEXT.md
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Centralize editable narrative copy"
          git push origin HEAD:agent/v8-forum-gameplay-rework
