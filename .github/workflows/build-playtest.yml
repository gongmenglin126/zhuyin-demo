name: Build Playtest Artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - name: Apply v9.2.2 controlled WeChat
        run: python .github/scripts/apply_v922_controlled_wechat.py
      - name: Apply v9.2.2 hard lock
        run: python .github/scripts/apply_v922b_wechat_hardlock.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- app/InteractiveWechat.tsx; then
            echo "No controlled WeChat changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/InteractiveWechat.tsx
            git commit -m "Harden WeChat action locks"
            git push origin HEAD:agent/v8-forum-gameplay-rework
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build single-file playtest
        run: npm run build:single
      - name: Upload playtest
        uses: actions/upload-artifact@v4
        with:
          name: zhuyin-v8-forum-playtest
          path: single-dist/index.html
          if-no-files-found: error
