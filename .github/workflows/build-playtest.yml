name: Build Playtest Artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build single-file playtest
        run: npm run build:single
      - name: Verify current reasoning flow and required assets
        shell: bash
        run: |
          grep -F 'const LY_ADMIN_FLOW=' app/InteractiveWechat.tsx
          grep -F '然后他们把这件事叫‘归巢’。' app/InteractiveWechat.tsx
          grep -F '她真的在‘沈妍’和‘林楠’两个名字之间来回说？' app/InteractiveWechat.tsx
          grep -F '该称谓不进入姓名索引' app/game-fixes.css
          ! grep -F 'ly-admin-2021-direct' app/InteractiveWechat.tsx
          test -f single-dist/index.html
          test -f single-dist/assets/occult/factory-faceless-idol.jpg
      - name: Upload playtest
        uses: actions/upload-artifact@v4
        with:
          name: zhuyin-v8-forum-playtest
          path: single-dist
          if-no-files-found: error
      - name: Publish updated playtest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./single-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
