name: Build Playtest Artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - name: Apply v9.2.1 interaction pass
        run: python .github/scripts/apply_v921_interaction_pass.py
      - name: Apply v9.2.1 reasoning recovery
        run: python .github/scripts/apply_v921b_reasoning_recovery.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- app/page.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx content/gameDataFlowV2.ts; then
            echo "No interaction source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/page.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx content/gameDataFlowV2.ts
            git commit -m "Make admin reasoning order-independent"
            git push origin HEAD:agent/v8-forum-gameplay-rework
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build single-file playtest
        run: npm run build:single
      - name: Upload playtest
        uses: actions/upload-artifact@v4
        with:
          name: zhuyin-v8-forum-playtest
          path: single-dist/index.html
          if-no-files-found: error
