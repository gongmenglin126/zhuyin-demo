name: Humanize WeChat Dialogue
on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/workflows/apply-v8.9.8-humanize-wechat.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Rewrite scripted WeChat replies to sound human
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/InteractiveWechat.tsx')
          s=p.read_text()
          repl={
          '户型和梦里的结构能对上，值得查。但它只能证明‘有现实原型’，不能证明她去过。先找原始记录。':'嗯，这个房型确实像。旧住户那段我会更在意。',
          '林楠？她没跟我提过这个人。你从哪翻到的？':'林楠？没听她提过。你从哪翻出来的？',
          '先别猜谁绑的。把林楠和沈妍两份旧报并排看：失踪时间、找回时间、回来后最早出现的变化。真正有用的是两边能不能互相对应。':'这就有点怪了。沈妍那条旧报你也找到了吗？我想看两边时间。',
          '……你怎么查到林楠这个名字的？先别在公开区发。要继续查，就看她回来以后有没有‘名字不对’、‘另一个家’这种很具体的东西。':'……林楠？你先别在论坛里写真名。她回来以后，有没有说过“这不是我家”之类的话？',
          '沈妍自己的旧报也按同样标准处理。家人口述和原报分开。重点不是‘都失踪过’，是回来以后各自多了什么、少了什么。':'对，就是这条。你先看日期。还有，她回来以后家里有没有说过她哪儿变了？',
          '目前只能证明两起案子时间很近、年龄相同、都被找回。先别直接推同一作案者。':'时间挨得太近了。不过先别急着当成同一伙人。',
          '我以前看到这篇时只当巧合。现在再看，真正让我不舒服的是两个人回来以后都像有东西对不上。':'我以前也看过。那时候觉得只是巧合，现在再看……有点不舒服。',
          '这篇有用，因为它把几种东西分开写了：名字不对、另一个家、生活习惯变化。你可以分别搜这些原话，看是不是只有一个人这样。':'这篇先留着。“名字不对”和“另一个家”这两句，我感觉不止一个人说过。',
          '这篇我看过。‘别人叫我的名字不对’和‘另一个家’这两句特别像我以前的感觉。先搜原话，别搜‘换魂’。':'这篇我记得。“名字不对”那句……我自己也有过。',
          '这个案例反而很重要：只有口味变化，没有名字错位、陌生家庭记忆或技能断层。它提醒你‘失踪后变了’本身不够说明问题。':'这个反而不像。只是不吃东西，太普通了。',
          '我没有这种单纯口味变化。我的情况更接近‘名字像叫错了’和‘脑子里有另一个家’。':'这个跟我不太一样。',
          '她最近跟我说过梦越来越像真的，但没跟我提过林楠这个名字。':'她跟我提过那个梦，说最近越来越清楚。林楠这个名字我真没听过。',
          '这条先别碰经文。最奇怪的是：沈妍记住了一个自己没住过的房间，而且记忆落到了林楠这个名字上。下一步应该找反方向——林楠那边有没有属于沈妍的东西。':'等下。她梦里的房间后来真找到了？那林楠那边你查过没有？',
          '她写‘像手已经做过几百次’这句我能理解。你去站里搜几句很普通的话：‘名字不对’、‘另一个家’。有人真的这样写过。':'她写“手自己会动”那句……我有点懂。你搜搜“名字不对”或者“另一个家”吧，我以前看到过类似的。',
          '不用把所有怪事一口气看完。她这份记录已经给了三个能查的方向：‘名字不对’、‘另一个家’、‘回来以后不会’。一次搜一个，先找能核验的案例。':'这里面有几条我见过类似说法。“名字不对”“另一个家”“回来以后不会”。你分开搜吧。',
          '这里面有两类我能确认：名字像叫错了、记得另一个家。我以前在论坛写过，旧号还在。你按这两句搜，比猜我标题快。':'“名字不对”和“另一个家”这两种我都经历过。旧号里可能还留着。',
          '这张残页来源字段没了。先把它当宗教文本，不要当事实证明。‘身’‘名’这些词以后如果在别处重复出现，再回来对。':'这句我不懂。先留着吧，别因为它看着像答案就硬往上套。',
          '‘身非我身，名非我名’这句我见过。不是公开帖正文，是以前有人发给我的一张旧纸截图。我当时没看懂。':'这句……我见过。以前有人给我发过一张旧纸，差不多就是这个。',
          '先翻成白话，不替它证明：‘舍’像身体，‘客’像魂；‘二客、两门相应’至少是在说两个主体和两个身体一起发生变化。现在别再啃字了，回现实里找：一边失去的东西，有没有正好出现在另一边。如果能对上，才值得谈‘交换’。':'这下稍微能看懂点了。“舍”像身体，“客”像人……但“二客相契”到底什么意思，我也不敢下结论。你把沈妍和林楠两边对着看。',
          '我第一次看到也看不懂。你先把沈妍和林楠两个人对着看：一个人记得不属于自己的家，另一个人有没有相反的错位？如果两边能互相补上，我会先猜是‘进错了身体’。是不是互换，我不敢替你下结论。':'我第一反应挺邪门的：像是人进错了地方。你别当我结论，我只是看到这几句会这么想。',
          '昨天见到她了。后来她说还有点事，我就先走了。我以为她回家了。':'见到了。后来她说还有点事，让我先走。我真以为她回家了。',
          '这个名字我真没听她说过。':'真没听她提过这个名字。',
          '先别围着名字猜。把两份旧报的日期、年龄、找回后的变化并排放。':'沈妍那条旧报你也翻出来了吗？我想先看时间。',
          '如果现实里确实联系不上，先走正常报警和亲友确认。论坛材料不要代替现实证据。':'现在还联系不上？那你先报警，也跟她家里说一声。这个别只在网上查。',
          '先别用这个词。你要找的是能区分‘创伤记忆’和‘两个人发生对应错位’的材料。看看一边缺的东西有没有出现在另一边。':'你先别把“换魂”当答案。两边有没有什么东西能互相对上？没有的话我不敢这么猜。',
          '对，先搜原话。关键词越像当事人会说的话越好，不要搜结论。':'嗯，搜原话吧。比搜“换魂”靠谱。',
          '别在这个号里反复写真名。你如果已经看到旧报，就继续查她回来后最早的变化。':'你先别在公开区写真名。她回来以后最早哪里不对，你有看到吗？',
          '我能确认的是：有些人回来后真的会觉得名字不对，也有人记得另一个家、突然不会以前会的东西。原因我不知道。':'有。我自己也有过。名字像别人的，脑子里又会冒出一个不认识的家。',
          '我以前也这么猜过，但只有感觉不算证据。你得先看两个人的‘错位’是不是能互相对应。':'我也想过……但我不敢说就是。要是两个人的东西真能互相对上，那才吓人。',
          '你好，我是徐宁，沈妍的朋友。她今天一直联系不上，我现在在她家，用的是她电脑上的微信。想问你几件她最近在查的事。':'你好，我是徐宁，沈妍的朋友。她今天一直联系不上，我现在在她家。她电脑上微信还登着，冒昧问你两句。'
          }
          for a,b in repl.items():
              if a not in s:
                  print('missing:',a)
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/InteractiveWechat.tsx
          git diff --cached --quiet || git commit -m 'Humanize WeChat scripted dialogue'
          git push
