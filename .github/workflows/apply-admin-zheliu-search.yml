name: Apply Admin Zheliu Search

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - .admin-zheliu-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable admin search for Zheliu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/AdminPortalOccult.tsx')
          s=p.read_text()
          pairs=[
            ('import {SharedMaterial,getFirstContactTime,triggerAdminWechatBeat,triggerZhouLocationThreat} from "./InteractiveWechat";', 'import {SharedMaterial,discoverZhouIdentity,getFirstContactTime,triggerAdminWechatBeat,triggerZhouLocationThreat} from "./InteractiveWechat";'),
            ('type ResultKind="shen"|"liang"|"lin"|"third"|null;', 'type ResultKind="shen"|"liang"|"lin"|"third"|"zheliu"|null;'),
            ('if(/19-07|候舍/.test(t))return "third";return null}', 'if(/19-07|候舍/.test(t))return "third";if(/折柳|周川/.test(t))return "zheliu";return null}'),
            ('placeholder="姓名 / UID / 记录编号 / 客编号"', 'placeholder="姓名 / 论坛账号 / UID / 记录编号 / 客编号"'),
            ('{result==="third"&&<ThirdRecord onCopyMaterial={onCopyMaterial} hasMaterial={hasMaterial}/>}</>}</>}', '{result==="third"&&<ThirdRecord onCopyMaterial={onCopyMaterial} hasMaterial={hasMaterial}/>} {result==="zheliu"&&<ZheliuAdminRecord/>}</>}</>}'),
            ('function Operations(){const zhouTime=getFirstContactTime("zc");', 'function ZheliuAdminRecord(){\n useEffect(()=>{discoverZhouIdentity()},[]);\n return <article style={s.userRecord}><header style={s.userHead}><span><h3>折柳</h3><small>论坛账号 · 实名关联：周川</small></span><em>实名已核验</em></header><section style={s.adminPanel}><h4>账号资料</h4><Record date="账号" title="折柳" meta="烛阴旧闻论坛账号" text="实名验证字段：周川。"/><Record date="身份补录" title="0712-4471 · 访问者记录" meta="来源账号：折柳" text="提交访问者身份：徐宁。保留观察。"/><Record date="实名映射" title="周川" meta="账号主体一致" text="后台实名验证记录确认：折柳与周川为同一账号主体。"/></section></article>\n}\n\nfunction Operations(){const zhouTime=getFirstContactTime("zc");')
          ]
          for old,new in pairs:
            if old not in s:
              raise SystemExit('expected source fragment not found')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify build
        run: npm run build:single
      - name: Commit source change
        run: |
          if git diff --quiet -- app/AdminPortalOccult.tsx; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx
          git commit -m "Enable Zheliu lookup in admin search"
          git push origin HEAD:agent/v8-forum-gameplay-rework
