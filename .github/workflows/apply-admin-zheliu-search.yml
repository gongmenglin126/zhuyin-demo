name: Apply Admin Zheliu Search

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-admin-zheliu-search.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable admin search for Zheliu
        run: node scripts/apply-admin-zheliu-search.mjs
      - name: Verify build
        run: npm run build:single
      - name: Commit source change
        run: |
          if git diff --quiet -- app/AdminPortalOccult.tsx; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx
          git commit -m "Enable Zheliu lookup in admin search"
          git push origin HEAD:agent/v8-forum-gameplay-rework
