name: Final Polish Pass

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/final-polish-pass.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/final-polish-pass.py
      - run: npm run build:single
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/gameDataFlowV2.ts content/forumDialogues.ts content/wechatLiveDialogues.ts app/AdminPortalOccult.tsx content/adminDialogues.ts app/GameEnding.tsx content/endingDialogues.ts docs/CANON_v3.0_世界观与游戏设定唯一权威集.md public/assets/occult/factory-faceless-idol.svg
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Polish final horror beats and dialogue tone"
          git push origin HEAD:agent/v8-forum-gameplay-rework
