name: Fix Third Memory Copy

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/fix-third-memory-copy.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-third-memory-copy.py
      - run: npm run build:single
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/adminDialogues.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Clarify 19-07 partial Shen Yan memories"
          git push origin HEAD:agent/v8-forum-gameplay-rework
