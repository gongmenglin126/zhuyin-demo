name: Apply WeChat Persist Private P1

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths: ['.github/workflows/apply-v8.9.12b-wechat-persist-private-p1.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply source fixes
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode('').decode())
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gameDataFlow.ts app/InteractiveWechat.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Persist WeChat session and keep private clues grounded"
          git push
