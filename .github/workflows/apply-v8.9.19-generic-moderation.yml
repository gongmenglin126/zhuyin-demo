name: Apply v8.9.19 Generic Moderation

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v8919_generic_moderation.py'
      - '.github/workflows/apply-v8.9.19-generic-moderation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v8919_generic_moderation.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app content
          git diff --cached --quiet && exit 0
          git commit -m "Use generic moderation account names"
          git push origin HEAD:agent/v8-forum-gameplay-rework
