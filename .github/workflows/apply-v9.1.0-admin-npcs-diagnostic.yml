name: Apply v9.1.0 Admin NPCs Diagnostic

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/workflows/apply-v9.1.0-admin-npcs-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_v910_admin_npcs.py > /tmp/v910.log 2>&1
          PATCH_STATUS=$?
          if [ $PATCH_STATUS -eq 0 ]; then
            npm ci >> /tmp/v910.log 2>&1
            npm run build >> /tmp/v910.log 2>&1
            BUILD_STATUS=$?
          else
            BUILD_STATUS=99
          fi
          if [ $PATCH_STATUS -ne 0 ] || [ $BUILD_STATUS -ne 0 ]; then
            git reset --hard HEAD
            mkdir -p docs/debug
            cp /tmp/v910.log docs/debug/v910-admin-patch.log
            echo "patch_status=$PATCH_STATUS build_status=$BUILD_STATUS" >> docs/debug/v910-admin-patch.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/debug/v910-admin-patch.log
            git commit -m "Record v9.1.0 admin patch diagnostic"
            git push origin HEAD:agent/v8-forum-gameplay-rework
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx
          git commit -m "Rework admin database and activate core NPCs"
          git push origin HEAD:agent/v8-forum-gameplay-rework
