name: Apply Religion And Admin UX Pass

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-religion-admin-pass.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply religion and admin UX pass
        run: python scripts/apply-religion-admin-pass.py
      - name: Verify single-file build
        run: npm run build:single
      - name: Commit source changes
        run: |
          if git diff --quiet -- app/AdminPortalOccult.tsx app/page.tsx content/gameDataFlowV2.ts docs/CANON_v3.0_世界观与游戏设定唯一权威集.md; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx app/page.tsx content/gameDataFlowV2.ts docs/CANON_v3.0_世界观与游戏设定唯一权威集.md
          git commit -m "Expand cult presence and admin revisit flow"
          git push origin HEAD:agent/v8-forum-gameplay-rework
