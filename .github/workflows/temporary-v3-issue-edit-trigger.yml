name: Temporary V3 Issue Edit Trigger

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Extract and apply approved patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          src=Path('control/.github/workflows/temporary-apply-v3-full-flow.yml').read_text()
          start=src.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=src.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          subprocess.run(['python','-c',code],cwd='work',check=True)
          PY
      - name: Build
        working-directory: work
        run: |
          npm ci
          npm run build:single
      - name: Commit tested source changes
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/PrivateArea.tsx app/InteractiveWechat.tsx app/AdminPortalOccult.tsx docs/CANON_v3.0_世界观与游戏设定唯一权威集.md
          git diff --cached --quiet || git commit -m "Complete full-flow playtest to endings"
          git push origin HEAD:agent/v8-forum-gameplay-rework
      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Full-flow patch applied and build passed.'})
            github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'})
