name: Apply v9.0.3 Canon Source Sync

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths:
      - '.github/scripts/apply_v903_canon_source_sync.py'
      - '.github/workflows/apply-v9.0.3-canon-source-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - run: python .github/scripts/apply_v903_canon_source_sync.py
      - name: Commit canon source sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app content
          git diff --cached --quiet && exit 0
          git commit -m "Sync legacy content to revised swap canon"
          git push origin HEAD:agent/v8-forum-gameplay-rework
