name: Apply v9.2 Admin Storyflow

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - '.github/scripts/apply_v920_admin_storyflow.py'
      - '.github/workflows/apply-v9.2-admin-storyflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_v920_admin_storyflow.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/AdminPortalOccult.tsx app/InteractiveWechat.tsx
          git diff --cached --quiet || git commit -m 'Build admin soul-swap investigation flow'
          git push origin HEAD:agent/v8-forum-gameplay-rework
