name: Apply Fullscreen Liturgy

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/apply-liturgy-fullscreen.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fullscreen liturgy
        run: python scripts/apply-liturgy-fullscreen.py
      - name: Verify build
        run: npm run build:single
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/AdminPortalOccult.tsx
          if git diff --cached --quiet; then
            echo "No source change"
            exit 0
          fi
          git commit -m "Make liturgy a fullscreen horror sequence"
          git push origin HEAD:agent/v8-forum-gameplay-rework
