name: Add Warm Nest Lure

on:
  push:
    branches:
      - agent/v8-forum-gameplay-rework
    paths:
      - scripts/add-warm-nest-lure.py
      - .github/workflows/add-warm-nest-lure.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/add-warm-nest-lure.py
      - run: npm run build:single
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/InteractiveWechat.tsx content/gameDataFlowV2.ts app/page.tsx docs/CANON_v3.0_世界观与游戏设定唯一权威集.md
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Turn the forum welcome into a return-to-nest lure"
          git push origin HEAD:agent/v8-forum-gameplay-rework
