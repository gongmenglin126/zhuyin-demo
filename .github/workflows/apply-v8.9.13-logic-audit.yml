name: Apply v8.9.13 Logic Audit

on:
  push:
    branches: [agent/v8-forum-gameplay-rework]
    paths: ['.github/workflows/apply-v8.9.13-logic-audit.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v8-forum-gameplay-rework
      - name: Apply audited logic patch
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/apply_logic.py
          python /tmp/apply_logic.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/InteractiveWechat.tsx content/gameDataFlow.ts content/gameDataFlowV2.ts app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Ground WeChat clues in actual player context"
          git push
